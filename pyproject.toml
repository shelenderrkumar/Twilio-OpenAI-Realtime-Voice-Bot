[project]
name = "realtime-voice-agent"
version = "1.0.0"
description = "Phone and browser voice agent: Twilio Media Streams + OpenAI Realtime API + LangChain tools and RAG."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shelender Kumar" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13,<16",
    "python-multipart>=0.0.9",
    "twilio>=9.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
gmail = ["langchain-google-community[gmail]>=2.0"]
search = ["tavily-python>=0.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voicebot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Hash-based fake embeddings in tests are not semantically similar; real ones are.
    "ignore:Relevance scores must be between:UserWarning",
   "ignore::DeprecationWarning", "ignore::langchain_core._api.beta_decorator.LangChainBetaWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
